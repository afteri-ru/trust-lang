{{ if site.Params.maintenance.enabled }}
<!doctype html>
<html lang="{{ site.Language.Lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Site.Title }} — {{ site.Params.maintenance_message | default "в разработке" }}</title>
    <style>
      html,body{height:100%;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f8f9fa;color:#212529;}
      .m-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;padding:24px;box-sizing:border-box;}
      .m-msg{font-size:1.5rem;font-weight:600;margin-bottom:10px;}
      .m-sub{color:#6c757d;max-width:34em;}
    </style>
  </head>
  <body>
    <div class="m-wrap">
      <div class="m-msg">{{ site.Params.maintenance_message | default "Сайт находится в разработке" }}</div>
      {{ with site.Params.maintenance_submessage }}<div class="m-sub">{{ . }}</div>{{ end }}
    </div>
  </body>
</html>
{{ end }}
