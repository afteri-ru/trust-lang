# Netlify build: runs ./gh-pages_build.sh (генерирует playground-фрагменты из уже
# закоммиченных docs/fragments, скачивает Monaco, собирает hugo БЕЗ --minify -
# встроенный JS-минификатор hugo не разбирает inline-JS playground).
# netlify.toml лежит в docs/, поэтому Netlify использует docs/ как base;
# скрипт gh-pages_build.sh тоже в docs/ и обязан запускаться из docs/.

[build]
command = "./gh-pages_build.sh"
publish = "gh-pages"

[build.environment]
GO_VERSION = "1.23.5"
HUGO_VERSION = "0.158.0"
